name: Auto release checks

on:
  pull_request:
    branches:
      - dev

jobs:
  version-check:
    name: Check package version increase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install version parser
        run: python -m pip install packaging
      - name: Compare PR version with main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          base_toml = subprocess.check_output(
              ["git", "show", f"{os.environ['BASE_SHA']}:pyproject.toml"],
              text=True,
          )
          base_version = Version(tomllib.loads(base_toml)["project"]["version"])
          with Path("pyproject.toml").open("rb") as project_file:
              pr_version = Version(tomllib.load(project_file)["project"]["version"])

          print(f"main version: {base_version}; PR version: {pr_version}")
          if pr_version <= base_version:
              raise SystemExit(
                  "::error file=pyproject.toml::Increase [project].version "
                  f"above {base_version} before merging into main."
              )
          PY