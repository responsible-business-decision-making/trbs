name: Tests for Windows

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  unittests-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies and build package
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install --dev
        pipenv run pip install -e .

    - name: Run unit tests
      run: pipenv run python -m pytest --import-mode=append tests/

    - name: Install nbmake
      run: pipenv run pip install nbmake

    - name: Run demo notebook
      run: pipenv run python -m pytest --nbmake --nbmake-timeout=900 vlinder_demo.ipynb
